<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t"><title id="t">AI benchmark scores before and after one year of progress</title>
<rect width="720" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e293b">
<text x="24" y="34" font-size="19" font-weight="700">One year of progress on two hard AI benchmarks</text>
<text x="24" y="58" fill="#475569" font-size="13">Source: Stanford HAI, 2026 AI Index Report</text>
<text x="24" y="118" font-weight="700">SWE-bench Verified (coding)</text>
<rect x="24" y="130" width="396" height="28" fill="#94a3b8"/><text x="430" y="150">≈60% (start of year)</text>
<rect x="24" y="164" width="640" height="28" fill="#2563eb"/><text x="600" y="184" fill="#ffffff" font-weight="700">≈100%</text>
<text x="24" y="248" font-weight="700">OSWorld (AI agents on real computer tasks)</text>
<rect x="24" y="260" width="79" height="28" fill="#94a3b8"/><text x="112" y="280">≈12%</text>
<rect x="24" y="294" width="437" height="28" fill="#7c3aed"/><text x="470" y="314">≈66% (human baseline ≈72%)</text>
</g></svg>
